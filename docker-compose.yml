# Supabase 公式セルフホスティング用テンプレート（supabase/supabase リポジトリの docker/
# フォルダ）のフルスタック構成（db, rest, auth, api-gw(Envoy), realtime, storage, imgproxy,
# meta, studio, functions, supavisor の11サービス）を再現したもの。学習・検証目的のため、
# 本番では使わない予定の Realtime / Edge Functions / Supavisor も含む
# （本番方針は doc_arch/backend.md 参照。ローカル環境とは独立した判断）。
#
# 段階的に追加しているため、当面は一部サービスのみが定義されている状態。
# 追加履歴・実装順序は docs_bevy_sample/ 配下の関連ドキュメントを参照。
#
# Usage
#   Start: docker compose up -d
#   Stop:  docker compose down
#
# このファイル中の「オリジナルのyml」は supabase/supabase リポジトリの
# docker/docker-compose.yml（commit 5a8eecf, 2026-08-11 時点）を指す。以降、本家との
# 差分がある行には「# オリジナルのymlから変更」というコメントを付けている。
#
# オリジナルのymlから変更: 本家にある Dev mode
# （docker compose -f docker-compose.yml -f ./dev/docker-compose.dev.yml up -d）と
# Reset everything（sh reset.sh）は、本プロジェクトに ./dev/ や reset.sh を持ち込んでいない
# ため記載していない。

name: supabase

services:

  rest:
    container_name: supabase-rest
    image: postgrest/postgrest:v14.12
    restart: unless-stopped
    # オリジナルのymlから変更: 以下のports指定を追加。Kong(api-gw)を介さず、Supabase の
    # REST API (PostgREST) 自体にホストから直接疎通確認するため公開している。
    ports:
      - "8001:3000"
    depends_on:
      db:
        # Disable this if you are using an external Postgres database
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "postgrest", "--ready" ]
      interval: 5s
      timeout: 5s
      retries: 3
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS}
      PGRST_DB_MAX_ROWS: ${PGRST_DB_MAX_ROWS:-1000}
      PGRST_DB_EXTRA_SEARCH_PATH: ${PGRST_DB_EXTRA_SEARCH_PATH:-public}
      PGRST_DB_ANON_ROLE: anon

      PGRST_ADMIN_SERVER_PORT: 3001
      PGRST_ADMIN_SERVER_HOST: localhost

      # PostgREST accepts a plain-text symmetric secret, a single JWK, or a JWKS.
      # For Podman, use either PGRST_JWT_SECRET: ${JWT_SECRET} or
      # PGRST_JWT_SECRET: ${JWT_JWKS}
      PGRST_JWT_SECRET: ${JWT_JWKS:-${JWT_SECRET}}

      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY}
    command:
      [
        "postgrest"
      ]

  # Supabase公式セルフホストのデフォルトAPIゲートウェイ(2026年8月からKongに代わって採用)。
  # 詳細な選定理由は docs_bevy_sample/20260816_api-gateway-nginx-kong-envoy-tradeoff-analysis.md。
  # 設定ファイル(envoy.yaml/cds.yaml/lds.template.yaml/docker-entrypoint.sh)は
  # supabase/supabase公式リポジトリのものをそのまま流用している(削減編集はしない)。
  api-gw:
    container_name: supabase-envoy
    image: envoyproxy/envoy:v1.39.0
    restart: unless-stopped
    # オリジナルのymlから変更: Kong→Envoy移行期の後方互換のため本家が設定している
    # network alias（`envoy`/`kong` どちらのホスト名でも解決できるようにする設定）は、
    # 本プロジェクトはKongを使わない前提のため未使用。設定自体は削除せずコメントアウトで残す。
    # networks:
    #   default:
    #     # Expose `envoy` and `kong` as network aliases, so internal configs
    #     # that reference either hostname resolve to whichever gateway is active.
    #     aliases:
    #       - envoy
    #       - kong
    healthcheck:
      # Using a TCP port check because this image does not include curl or wget.
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/127.0.0.1/8000'"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      studio:
        condition: service_healthy
    ports:
      # オリジナルのymlから変更: ${KONG_HTTP_PORT} へのフォールバックはKong未使用のため削除。
      - "${API_GW_HTTP_PORT:-8000}:8000"
    volumes:
      - ./supabase-local/volumes/api/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro  # オリジナルのymlから変更: ./volumes/api/envoy/envoy.yaml からパスをリネーム
      - ./supabase-local/volumes/api/envoy/cds.yaml:/etc/envoy/cds.yaml:ro  # オリジナルのymlから変更: ./volumes/api/envoy/cds.yaml からパスをリネーム
      - ./supabase-local/volumes/api/envoy/lds.template.yaml:/etc/envoy/lds.template.yaml:ro  # オリジナルのymlから変更: ./volumes/api/envoy/lds.template.yaml からパスをリネーム
      - ./supabase-local/volumes/api/envoy/docker-entrypoint.sh:/docker-entrypoint.sh:ro  # オリジナルのymlから変更: ./volumes/api/envoy/docker-entrypoint.sh からパスをリネーム
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      ANON_KEY_ASYMMETRIC: ${ANON_KEY_ASYMMETRIC:-}
      SERVICE_ROLE_KEY_ASYMMETRIC: ${SERVICE_ROLE_KEY_ASYMMETRIC:-}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
    entrypoint: ["/bin/sh", "/docker-entrypoint.sh"]

  auth:
    container_name: supabase-auth
    image: supabase/gotrue:v2.189.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health" ]
      interval: 5s
      timeout: 5s
      retries: 3
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}

      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}

      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS}
      GOTRUE_DISABLE_SIGNUP: "false"  # オリジナルのymlから変更: ${DISABLE_SIGNUP} を "false" に固定

      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY}

      # Legacy symmetric HS256 key
      GOTRUE_JWT_SECRET: ${JWT_SECRET}

      # JSON array of signing JWKs (EC private + legacy symmetric)
      # For Podman, use: GOTRUE_JWT_KEYS: ${JWT_KEYS}
      #GOTRUE_JWT_KEYS: ${JWT_KEYS:-[]}

      GOTRUE_JWT_ISSUER: ${API_EXTERNAL_URL}

      # メール・電話によるサインアップは今回のスコープ外（Google Social Loginのみ検証する）
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "false"  # オリジナルのymlから変更: ${ENABLE_EMAIL_SIGNUP} を "false" に固定
      # オリジナルのymlから変更: ${ENABLE_ANONYMOUS_USERS} は匿名ユーザーを使わないため未使用。コメントアウトのまま残す。
      # GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: ${ENABLE_ANONYMOUS_USERS}
      GOTRUE_MAILER_AUTOCONFIRM: "true"  # オリジナルのymlから変更: ${ENABLE_EMAIL_AUTOCONFIRM} を "true" に固定

      # Uncomment to bypass nonce check in ID Token flow. Commonly set to true when using Google Sign In on mobile.
      # GOTRUE_EXTERNAL_SKIP_NONCE_CHECK: "true"

      # オリジナルのymlから変更: メール認証を使わないため、SMTP関連の設定は値を入れず
      # コメントアウトのまま残す（本家の設定名・書式はそのまま）。
      # GOTRUE_MAILER_SECURE_EMAIL_CHANGE_ENABLED: "true"
      # GOTRUE_SMTP_MAX_FREQUENCY: 1s
      # GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL}
      # GOTRUE_SMTP_HOST: ${SMTP_HOST}
      # GOTRUE_SMTP_PORT: ${SMTP_PORT}
      # GOTRUE_SMTP_USER: ${SMTP_USER}
      # GOTRUE_SMTP_PASS: ${SMTP_PASS}
      # GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME}
      # GOTRUE_MAILER_URLPATHS_INVITE: ${MAILER_URLPATHS_INVITE}
      # GOTRUE_MAILER_URLPATHS_CONFIRMATION: ${MAILER_URLPATHS_CONFIRMATION}
      # GOTRUE_MAILER_URLPATHS_RECOVERY: ${MAILER_URLPATHS_RECOVERY}
      # GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: ${MAILER_URLPATHS_EMAIL_CHANGE}

      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"  # オリジナルのymlから変更: ${ENABLE_PHONE_SIGNUP} を "false" に固定
      # オリジナルのymlから変更: ${ENABLE_PHONE_AUTOCONFIRM} は電話認証を使わないため未使用。コメントアウトのまま残す。
      # GOTRUE_SMS_AUTOCONFIRM: ${ENABLE_PHONE_AUTOCONFIRM}

      # オリジナルのymlから変更: 本家はGoogle等の外部プロバイダを全てコメントアウトした
      # サンプルのままにしているが、Google Social Loginを検証する本プロジェクトでは
      # Googleのみコメントを外して実値を設定している。
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOOGLE_ENABLED}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_SECRET}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${API_EXTERNAL_URL}/callback

      # GOTRUE_EXTERNAL_GITHUB_ENABLED: ${GITHUB_ENABLED}
      # GOTRUE_EXTERNAL_GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      # GOTRUE_EXTERNAL_GITHUB_SECRET: ${GITHUB_SECRET}
      # GOTRUE_EXTERNAL_GITHUB_REDIRECT_URI: ${API_EXTERNAL_URL}/callback

      # GOTRUE_EXTERNAL_AZURE_ENABLED: ${AZURE_ENABLED}
      # GOTRUE_EXTERNAL_AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      # GOTRUE_EXTERNAL_AZURE_SECRET: ${AZURE_SECRET}
      # GOTRUE_EXTERNAL_AZURE_REDIRECT_URI: ${API_EXTERNAL_URL}/callback

      # Uncomment to configure SMS delivery (phone auth and phone MFA).
      # GOTRUE_SMS_PROVIDER: ${SMS_PROVIDER}
      # GOTRUE_SMS_OTP_EXP: ${SMS_OTP_EXP}
      # GOTRUE_SMS_OTP_LENGTH: ${SMS_OTP_LENGTH}
      # GOTRUE_SMS_MAX_FREQUENCY: ${SMS_MAX_FREQUENCY}
      # GOTRUE_SMS_TEMPLATE: ${SMS_TEMPLATE}

      # Twilio credentials (when SMS_PROVIDER=twilio)
      # GOTRUE_SMS_TWILIO_ACCOUNT_SID: ${SMS_TWILIO_ACCOUNT_SID}
      # GOTRUE_SMS_TWILIO_AUTH_TOKEN: ${SMS_TWILIO_AUTH_TOKEN}
      # GOTRUE_SMS_TWILIO_MESSAGE_SERVICE_SID: ${SMS_TWILIO_MESSAGE_SERVICE_SID}

      # Test OTP mappings for development
      # GOTRUE_SMS_TEST_OTP: ${SMS_TEST_OTP}

      # Uncomment to configure multi-factor authentication (MFA).
      # GOTRUE_MFA_TOTP_ENROLL_ENABLED: ${MFA_TOTP_ENROLL_ENABLED}
      # GOTRUE_MFA_TOTP_VERIFY_ENABLED: ${MFA_TOTP_VERIFY_ENABLED}
      # GOTRUE_MFA_PHONE_ENROLL_ENABLED: ${MFA_PHONE_ENROLL_ENABLED}
      # GOTRUE_MFA_PHONE_VERIFY_ENABLED: ${MFA_PHONE_VERIFY_ENABLED}
      # GOTRUE_MFA_MAX_ENROLLED_FACTORS: ${MFA_MAX_ENROLLED_FACTORS}

      # SAML SSO
      # See: https://supabase.com/docs/guides/self-hosting/self-hosted-saml-sso
      # GOTRUE_SAML_ENABLED: ${SAML_ENABLED}
      # GOTRUE_SAML_PRIVATE_KEY: ${SAML_PRIVATE_KEY}
      # GOTRUE_SAML_ALLOW_ENCRYPTED_ASSERTIONS: ${SAML_ALLOW_ENCRYPTED_ASSERTIONS}
      # GOTRUE_SAML_RELAY_STATE_VALIDITY_PERIOD: ${SAML_RELAY_STATE_VALIDITY_PERIOD}
      # GOTRUE_SAML_RATE_LIMIT_ASSERTION: ${SAML_RATE_LIMIT_ASSERTION}
      # Optional, defaults to API_EXTERNAL_URL if not set
      # GOTRUE_SAML_EXTERNAL_URL: ${SAML_EXTERNAL_URL}

      # Uncomment to enable custom access token hook.
      # See: https://supabase.com/docs/guides/auth/auth-hooks for
      # full list of hooks and additional details about custom_access_token_hook

      # GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_ENABLED: "true"
      # GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_URI: "pg-functions://postgres/public/custom_access_token_hook"
      # GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_SECRETS: "<standard-base64-secret>"

      # GOTRUE_HOOK_MFA_VERIFICATION_ATTEMPT_ENABLED: "true"
      # GOTRUE_HOOK_MFA_VERIFICATION_ATTEMPT_URI: "pg-functions://postgres/public/mfa_verification_attempt"

      # GOTRUE_HOOK_PASSWORD_VERIFICATION_ATTEMPT_ENABLED: "true"
      # GOTRUE_HOOK_PASSWORD_VERIFICATION_ATTEMPT_URI: "pg-functions://postgres/public/password_verification_attempt"

      # GOTRUE_HOOK_SEND_SMS_ENABLED: "false"
      # GOTRUE_HOOK_SEND_SMS_URI: "pg-functions://postgres/public/custom_access_token_hook"
      # GOTRUE_HOOK_SEND_SMS_SECRETS: "v1,whsec_VGhpcyBpcyBhbiBleGFtcGxlIG9mIGEgc2hvcnRlciBCYXNlNjQgc3RyaW5n"

      # GOTRUE_HOOK_SEND_EMAIL_ENABLED: "false"
      # GOTRUE_HOOK_SEND_EMAIL_URI: "http://host.docker.internal:54321/functions/v1/email_sender"
      # GOTRUE_HOOK_SEND_EMAIL_SECRETS: "v1,whsec_VGhpcyBpcyBhbiBleGFtcGxlIG9mIGEgc2hvcnRlciBCYXNlNjQgc3RyaW5n"

  studio:
    container_name: supabase-studio
    image: supabase/studio:2026.08.03-sha-022b374
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3000/api/platform/profile').then((r) => {if (r.status !== 200) throw new Error(r.status)})\""
        ]
      timeout: 10s
      interval: 5s
      retries: 3
      start_period: 20s
    environment:
      HOSTNAME: "0.0.0.0"
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER_READ_WRITE: postgres
      PG_META_CRYPTO_KEY: ${PG_META_CRYPTO_KEY}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS}
      PGRST_DB_MAX_ROWS: ${PGRST_DB_MAX_ROWS:-1000}
      PGRST_DB_EXTRA_SEARCH_PATH: ${PGRST_DB_EXTRA_SEARCH_PATH:-public}
      DEFAULT_ORGANIZATION_NAME: ${STUDIO_DEFAULT_ORGANIZATION}
      DEFAULT_PROJECT_NAME: ${STUDIO_DEFAULT_PROJECT}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      SUPABASE_URL: http://api-gw:8000
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      # オリジナルのymlから変更: 新しいopaque APIキー(publishable/secret key)は未使用のため
      # コメントアウトのまま残す（legacy HS256 JWTキーのみ使用）。
      # SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY}
      # SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY}
      ENABLED_FEATURES_LOGS_ALL: "false"
      SNIPPETS_MANAGEMENT_FOLDER: /app/snippets
      EDGE_FUNCTIONS_MANAGEMENT_FOLDER: /app/edge-functions
    volumes:
      - ./supabase-local/volumes/snippets:/app/snippets:z  # オリジナルのymlから変更: ./volumes/snippets からパスをリネーム
      - ./supabase-local/volumes/functions:/app/edge-functions:ro,z  # オリジナルのymlから変更: ./volumes/functions からパスをリネーム

  realtime:
    container_name: realtime-dev.supabase-realtime
    image: supabase/realtime:v2.102.3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sSfL --head -o /dev/null -H \"Authorization: Bearer ${ANON_KEY}\" http://localhost:4000/api/tenants/realtime-dev/health"
        ]
      timeout: 5s
      interval: 30s
      retries: 3
      start_period: 10s
    environment:
      PORT: 4000
      DB_HOST: ${POSTGRES_HOST}
      DB_PORT: ${POSTGRES_PORT}
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      DB_AFTER_CONNECT_QUERY: 'SET search_path TO _realtime'
      DB_ENC_KEY: ${REALTIME_DB_ENC_KEY:-supabaserealtime}

      # Legacy symmetric HS256 key
      API_JWT_SECRET: ${JWT_SECRET}

      # オリジナルのymlから変更: JWKSでの検証は未使用のためコメントアウトのまま残す。
      # JWKS for token verification (EC public + legacy symmetric).
      # For Podman, use: API_JWT_JWKS: ${JWT_JWKS}
      #API_JWT_JWKS: ${JWT_JWKS:-{"keys":[]}}

      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      METRICS_JWT_SECRET: ${JWT_SECRET}
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"
      DISABLE_HEALTHCHECK_LOGGING: "true"

  storage:
    container_name: supabase-storage
    image: supabase/storage-api:v1.60.4
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
      imgproxy:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://storage:5000/status"
        ]
      timeout: 5s
      interval: 5s
      retries: 3
      start_period: 10s
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000

      # Legacy symmetric HS256 key
      AUTH_JWT_SECRET: ${JWT_SECRET}

      # オリジナルのymlから変更: JWKSでの検証は未使用のためコメントアウトのまま残す。
      # JWKS for token verification (EC public + legacy symmetric).
      # For Podman, use: JWT_JWKS: ${JWT_JWKS}
      #JWT_JWKS: ${JWT_JWKS:-{"keys":[]}}

      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      STORAGE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      # S3 bucket when using S3 backend, directory name when using 'file'
      GLOBAL_S3_BUCKET: ${GLOBAL_S3_BUCKET}
      # オリジナルのymlから変更: S3バックエンドは未使用（STORAGE_BACKEND: file のため）
      # のためコメントアウトのまま残す。
      # S3 Backend configuration
      #GLOBAL_S3_ENDPOINT: https://your-s3-endpoint
      #GLOBAL_S3_PROTOCOL: https
      #GLOBAL_S3_FORCE_PATH_STYLE: "true"
      #AWS_ACCESS_KEY_ID: your-access-key-id
      #AWS_SECRET_ACCESS_KEY: your-secret-access-key
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: ${STORAGE_TENANT_ID}
      # TODO: https://github.com/supabase/storage-api/issues/55
      REGION: ${REGION}
      ENABLE_IMAGE_TRANSFORMATION: "true"
      IMGPROXY_URL: http://imgproxy:5001
      # S3 protocol endpoint configuration
      S3_PROTOCOL_ACCESS_KEY_ID: ${S3_PROTOCOL_ACCESS_KEY_ID}
      S3_PROTOCOL_ACCESS_KEY_SECRET: ${S3_PROTOCOL_ACCESS_KEY_SECRET}
    volumes:
      - ./supabase-local/volumes/storage:/var/lib/storage:z  # オリジナルのymlから変更: ./volumes/storage からパスをリネーム

  # DBプーラー。学習・検証目的でのみ追加し、rest/authの接続経路には使わない(dbに直結したまま)。
  # doc_arch/backend.md §4の「本番ではSupavisorと二重に挟まない」方針とは独立(注記参照)。
  supavisor:
    container_name: supabase-pooler
    image: supabase/supavisor:2.9.5
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT}:5432"
      - "${POOLER_PROXY_PORT_TRANSACTION}:6543"
    volumes:
      - ./supabase-local/volumes/pooler/pooler.exs:/etc/pooler/pooler.exs:ro,z  # オリジナルのymlから変更: ./volumes/pooler/pooler.exs からパスをリネーム
    healthcheck:
      test: [ "CMD", "curl", "-sSfL", "--head", "-o", "/dev/null", "http://127.0.0.1:4000/api/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_URL: ecto://supabase_admin:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/_supabase
      CLUSTER_POSTGRES: "true"
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      VAULT_ENC_KEY: ${VAULT_ENC_KEY}
      API_JWT_SECRET: ${JWT_SECRET}
      METRICS_JWT_SECRET: ${JWT_SECRET}
      REGION: local
      ERL_AFLAGS: -proto_dist inet_tcp
      POOLER_TENANT_ID: ${POOLER_TENANT_ID}
      POOLER_DEFAULT_POOL_SIZE: ${POOLER_DEFAULT_POOL_SIZE}
      POOLER_MAX_CLIENT_CONN: ${POOLER_MAX_CLIENT_CONN}
      POOLER_POOL_MODE: transaction
      DB_POOL_SIZE: ${POOLER_DB_POOL_SIZE}
    command:
      [ "/bin/sh", "-c", "/app/bin/migrate && /app/bin/supavisor eval \"$$(cat /etc/pooler/pooler.exs)\" && /app/bin/server" ]

  functions:
    container_name: supabase-edge-functions
    image: supabase/edge-runtime:v1.74.0
    restart: unless-stopped
    volumes:
      - ./supabase-local/volumes/functions:/home/deno/functions:z  # オリジナルのymlから変更: ./volumes/functions からパスをリネーム
      - deno-cache:/root/.cache/deno
    depends_on:
      api-gw:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/127.0.0.1/9000'"]
      interval: 5s
      timeout: 5s
      retries: 3
    environment:
      # Legacy symmetric HS256 key
      JWT_SECRET: ${JWT_SECRET}
      # オリジナルのymlから変更: JWKSでの検証は未使用のためコメントアウトのまま残す。
      # JWKS for token verification (EC public + legacy symmetric).
      # For Podman, use: SUPABASE_JWKS: ${JWT_JWKS}
      #SUPABASE_JWKS: ${JWT_JWKS:-{"keys":[]}}

      SUPABASE_URL: http://api-gw:8000
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      # Legacy API keys (HS256-signed JWTs)
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      # オリジナルのymlから変更: studio と同様、新しいopaque APIキーは未使用のため
      # コメントアウトのまま残す。
      # New opaque API keys
      # SUPABASE_PUBLISHABLE_KEYS: "{\"default\":\"${SUPABASE_PUBLISHABLE_KEY:-}\"}"
      # SUPABASE_SECRET_KEYS: "{\"default\":\"${SUPABASE_SECRET_KEY:-}\"}"
      SUPABASE_DB_URL: postgresql://postgres:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      # TODO: Allow configuring VERIFY_JWT per function.
      VERIFY_JWT: "${FUNCTIONS_VERIFY_JWT}"
    command: [ "start", "--main-service", "/home/deno/functions/main" ]

  meta:
    container_name: supabase-meta
    image: supabase/postgres-meta:v0.96.6
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: ${POSTGRES_HOST}
      PG_META_DB_PORT: ${POSTGRES_PORT}
      PG_META_DB_NAME: ${POSTGRES_DB}
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
      CRYPTO_KEY: ${PG_META_CRYPTO_KEY}

  imgproxy:
    container_name: supabase-imgproxy
    image: darthsim/imgproxy:v3.30.1
    restart: unless-stopped
    volumes:
      - ./supabase-local/volumes/storage:/var/lib/storage:z  # オリジナルのymlから変更: ./volumes/storage からパスをリネーム
    healthcheck:
      test: [ "CMD", "imgproxy", "health" ]
      timeout: 5s
      interval: 5s
      retries: 3
    environment:
      IMGPROXY_BIND: ":5001"
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: /
      IMGPROXY_USE_ETAG: "true"
      IMGPROXY_AUTO_WEBP: ${IMGPROXY_AUTO_WEBP}
      IMGPROXY_MAX_SRC_RESOLUTION: 16.8

  # オリジナルのymlから変更: 本家にある
  # "Comment out everything below this point if you are using an external Postgres database"
  # というコメントは省略している（外部Postgresへの切替を想定していないため）。
  db:
    container_name: supabase-db
    # To upgrade an existing Postgres 15 database in place, see utils/upgrade-pg17.sh.
    image: supabase/postgres:17.6.1.136
    restart: unless-stopped
    volumes:
      # オリジナルのymlから変更: 以下、mountの列挙順は本家(realtime.sql → webhooks.sql →
      # roles.sql → jwt.sql → data → _supabase.sql → logs.sql → pooler.sql → db-config)
      # と異なるが、docker-entrypoint-initdb.d 配下の実行順序はターゲットパスの数字
      # プレフィックス（50, 60, 97, 98, 99）で決まるため、列挙順自体は動作に影響しない。

      # オリジナルのymlにない追加: auth.uid() 等の所有者を supabase_auth_admin に付け替える
      # （auth サービス起動に必要）。
      - ./supabase-local/volumes/db/auth-grants.sql:/docker-entrypoint-initdb.d/init-scripts/60-auth-grants.sql:Z
      # オリジナルのymlにない追加: poc_check テーブル定義（sandbox/supabase-rest-client-check/ の疎通確認用）
      - ./supabase-local/volumes/db/poc_check.sql:/docker-entrypoint-initdb.d/init-scripts/50-poc-check.sql:Z
      # オリジナルのymlから変更: ./volumes/db/webhooks.sql からパスをリネーム。コメントも
      # "Must be superuser to create event trigger" から、functions(Edge Runtime) 用に
      # supabase_functions_admin ロール・pg_net拡張・supabase_functionsスキーマを作成する
      # 旨の説明に置き換えている。roles.sql(99番)より先に実行される必要がある。
      - ./supabase-local/volumes/db/webhooks.sql:/docker-entrypoint-initdb.d/init-scripts/98-webhooks.sql:Z
      # オリジナルのymlから変更: ./volumes/db/jwt.sql からパスをリネーム。コメントも
      # "Initialize the database settings with JWT_SECRET and JWT_EXP" から、
      # app.settings.jwt_secret / jwt_exp をDB側GUCとして設定する旨の説明に置き換えている。
      - ./supabase-local/volumes/db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:Z
      # オリジナルのymlから変更: ./volumes/db/roles.sql からパスをリネーム。コメントも
      # "Must be superuser to alter reserved role" に、authenticator ロールのパスワード
      # 設定が rest(PostgREST) の PGRST_DB_URI で実際に使われている旨を追記している。
      - ./supabase-local/volumes/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:Z
      # オリジナルのymlから変更: ./volumes/db/realtime.sql からパスをリネーム。コメントも
      # realtime(Realtime) 用に _realtime スキーマを作成する旨の説明に置き換えている。
      - ./supabase-local/volumes/db/realtime.sql:/docker-entrypoint-initdb.d/migrations/99-realtime.sql:Z
      # オリジナルのymlから変更: ./volumes/db/_supabase.sql からパスをリネーム。コメントも
      # "Changes required for internal supabase data such as _analytics" から、
      # supavisor/analytics(未使用だが公式構成に合わせる) が使う _supabase 管理DBを作成する
      # 旨の説明に置き換えている。
      - ./supabase-local/volumes/db/_supabase.sql:/docker-entrypoint-initdb.d/migrations/97-_supabase.sql:Z
      # オリジナルのymlから変更: ./volumes/db/logs.sql からパスをリネーム
      # （本家にあった "Changes required for Analytics support" コメントは省略）。
      - ./supabase-local/volumes/db/logs.sql:/docker-entrypoint-initdb.d/migrations/99-logs.sql:Z
      # オリジナルのymlから変更: ./volumes/db/pooler.sql からパスをリネーム
      # （本家にあった "Changes required for Pooler support" コメントは省略）。
      - ./supabase-local/volumes/db/pooler.sql:/docker-entrypoint-initdb.d/migrations/99-pooler.sql:Z
      # オリジナルのymlから変更: 本家は ./volumes/db/data （bind mount）だが、
      # Rancher Desktop の virtiofs 経由ではホストディレクトリへの chown が失敗するため、
      # bind mount ではなく Docker 管理の named volume（db-data、下記 volumes: トップレベルに追加）を使う。
      - db-data:/var/lib/postgresql/data:Z
      # Use named volume to persist pgsodium decryption key between restarts
      - db-config:/etc/postgresql-custom
    healthcheck:
      test:
        [
        "CMD",
        "pg_isready",
        "-U",
        "postgres",
        "-h",
        "localhost"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: ${POSTGRES_PORT}
      POSTGRES_PORT: ${POSTGRES_PORT}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      POSTGRES_DB: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: ${JWT_EXPIRY}
    command:
      [
        "postgres",
        "-c",
        "config_file=/etc/postgresql/postgresql.conf",
        "-c",
        "log_min_messages=fatal" # prevents Realtime polling queries from appearing in logs
      ]

volumes:
  db-config:
  db-data:  # オリジナルのymlにはない追加。db serviceのvolumesでbind mountの代わりに使うnamed volume
  deno-cache:
